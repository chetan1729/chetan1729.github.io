<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Chetan Prakash's personal website.">
    <meta name="theme-color" content="#f7f6f2">
    <title>Chetan Prakash</title>
    <style>
      :root { color-scheme: light; --paper: #f7f6f2; --ink: #242b29; --muted: #626b66; --green: #285c49; --line: #d7dcd5; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.7 system-ui, sans-serif; }
      a { color: var(--green); text-underline-offset: 5px; }
      a:hover { text-decoration-thickness: 2px; }
      a:focus-visible { outline: 2px solid var(--green); outline-offset: 6px; }
      .skip { position: absolute; left: 20px; top: -100px; }
      .skip:focus { top: 12px; }
      .wrap { width: min(100% - 48px, 960px); margin-inline: auto; }
      header { display: flex; justify-content: space-between; align-items: center; padding-block: 30px; border-bottom: 1px solid var(--line); }
      .mark { color: var(--ink); text-decoration: none; font-weight: 650; letter-spacing: -.04em; font-size: 24px; }
      header a:last-child { font-size: 14px; }
      main { min-height: calc(100svh - 186px); padding-block: clamp(70px, 12vw, 140px); }
      .eyebrow { font-size: 12px; letter-spacing: .17em; text-transform: uppercase; color: var(--muted); }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: clamp(50px, 9vw, 92px); line-height: 1.08; letter-spacing: -.055em; margin: 24px 0; }
      .intro { max-width: 480px; color: var(--muted); font-size: 20px; }
      .link { display: inline-block; margin-top: 22px; font-size: 16px; }
      .about { border-top: 1px solid var(--line); margin-top: 80px; padding-top: 26px; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
      h2 { font-size: 14px; font-weight: 550; margin: 0; }
      .about p { margin: 0; max-width: 440px; color: var(--muted); }
      footer { border-top: 1px solid var(--line); padding-block: 23px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 20px; }
      @media (max-width: 560px) { .wrap { width: calc(100% - 40px); } .about { grid-template-columns: 1fr; gap: 12px; margin-top: 60px; } .intro { font-size: 18px; } }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wrap">
      <header>
        <a class="mark" href="./" aria-label="Chetan Prakash home">CP.</a>
        <a href="https://github.com/chetan1729">GitHub <span aria-hidden="true">↗</span></a>
      </header>
      <main id="main">
        <div class="eyebrow">Personal website</div>
        <h1>Chetan Prakash<span style="color:var(--green)">.</span></h1>
        <p class="intro">Welcome to my corner of the web.</p>
        <a class="link" href="https://github.com/chetan1729">Explore my GitHub <span aria-hidden="true">↗</span></a>
        <section class="about" aria-labelledby="about-heading">
          <h2 id="about-heading">Around the web</h2>
          <p>You can find my code and projects on <a href="https://github.com/chetan1729">GitHub</a>.</p>
        </section>
      </main>
      <footer><span>Chetan Prakash</span><span>Hosted on GitHub Pages</span></footer>
    </div>
  </body>
</html>
